[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not lmstudio and not docker and not qdrant"
markers =
    lmstudio: prova reale con LM Studio attivo
    docker: prova reale con Docker e LM Studio attivi
    qdrant: prova reale della pipeline RAG con Qdrant e LM Studio attivi (lezione 7)
filterwarnings =
    ignore:Payload indexes have no effect in the local Qdrant:UserWarning
