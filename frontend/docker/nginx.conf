# nginx del front-end (lezione 6, step 9): serve la pagina e fa da proxy per le chiamate API.
#
#   http://localhost:8085/            → i file della pagina
#   http://localhost:8085/api/chat    → http://backend:8002/chat   (il prefisso /api viene tolto)
#
# Così il browser vede un solo indirizzo: niente CORS, e il back-end non è esposto sul computer.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # La pagina cambia a ogni build: il browser deve sempre chiedere se è aggiornata.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # La barra finale toglie il prefisso /api: /api/chat diventa /chat sul back-end.
        proxy_pass http://backend:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Streaming (slide 18): gli eventi devono passare appena arrivano, non accumulati a blocchi.
        proxy_buffering off;
        proxy_cache off;

        # Tra un evento e l'altro possono passare decine di secondi (router e revisore chiamano il
        # modello senza produrre testo): con i 60 s predefiniti nginx chiuderebbe il collegamento.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
