# Lezione 6. Servizi presenti finora:
#   agente    (step 6) il servizio HTTP dell'agente, porta 8001
#   postgres  (step 7) il database delle chat, usato dal back-end
# Il back-end in questo step gira in locale con uvicorn; lo step 9 porterà tutto a quattro container.
services:
  agente:
    build: .
    env_file: .env
    environment:
      LM_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"

  postgres:
    image: postgres:17
    # Le credenziali arrivano dal file .env (escluso da Git): qui ci sono solo i nomi delle variabili.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5434 sul computer → 5432 nel container: sulla macchina di sviluppo 5432 e 5433 sono già occupate
      # (PostgreSQL installato su Windows e database di un altro progetto).
      - "5434:5432"
    volumes:
      # Volume con nome: i dati sopravvivono a `docker compose down` e al riavvio del container.
      - dati_postgres:/var/lib/postgresql/data
    healthcheck:
      # «Sano» solo quando PostgreSQL accetta connessioni: servirà allo step 9 per far partire dopo il back-end.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dati_postgres:
